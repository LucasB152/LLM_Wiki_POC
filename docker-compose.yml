services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: wiki
      POSTGRES_PASSWORD: wiki
      POSTGRES_DB: llmwiki
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wiki -d llmwiki"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build: ./llm_wiki_api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://wiki:wiki@db:5432/llmwiki
      API_KEY_ENCRYPTION_KEY: ${API_KEY_ENCRYPTION_KEY:?set API_KEY_ENCRYPTION_KEY in .env (openssl rand -base64 32)}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    ports:
      - "3000:3000"

  # One-shot: saves the API key and ingests some sample sources, then stops.
  seed:
    build: ./llm_wiki_api
    entrypoint: ["./docker/seed.sh"]
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_URL: http://api:3000
      # Read from the .env next to this file (Compose does not pass it on by itself)
      LLM_PROVIDER: ${LLM_PROVIDER:-ANTHROPIC}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      SEED_SOURCES: ${SEED_SOURCES:-00-vue-ensemble-modeles-en-couches.md 01_couche_physique.md 02-couche-liaison-de-donnees.md}
    restart: "no"
